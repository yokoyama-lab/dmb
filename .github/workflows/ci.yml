name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"   # 毎週月曜 03:00 UTC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 理論の計算は標準ライブラリだけで動くので，まず依存ゼロで走らせる
      - name: 依存ゼロでの検査
        run: |
          python -m unittest discover -s tests -t . -v
          python dmb_core.py 4 4
          python dmb_core.py --table
          python dmb_core.py --json > /dev/null
          python dmb_core.py --field 2 > /dev/null
          python complexes.py
          python examples.py
          python export.py --format tikz --ni 4 --nj 4 > /dev/null
          python search.py --ni 4 --nj 3 --values 2 --limit 20 > /dev/null

      - name: 可視化つきの検査
        run: |
          pip install -e ".[app,pages]"
          python -m unittest discover -s tests -t . -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check .

  # TikZ が本当に LaTeX で組めるか
  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends
              texlive-latex-base texlive-pictures
      - run: DMB_LATEX=1 python -m unittest tests.test_export -v

  # 重い検査（乱択の試行増・全数探索との突き合わせ）は週 1 回
  soak:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: DMB_TRIALS=60 python -m unittest tests.test_properties -v
      - run: DMB_SLOW=1 python -m unittest tests.test_search -v
