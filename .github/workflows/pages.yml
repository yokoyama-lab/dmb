name: Pages

# pages.py が書き出す静的サイトを GitHub Pages へ載せる。
# 有効にするには Settings → Pages → Source を "GitHub Actions" にしておく。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 走っている配備は止めない（並行だけ抑える）
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e ".[app,pages]"
      - run: python pages.py -o _site
      # 図が本当に入っているか（空のサイトを配ってしまわないように）
      - name: 生成物の確認
        run: |
          test -f _site/index.html
          test -f _site/results.html
          test "$(ls _site/*.html | wc -l)" -ge 9
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
